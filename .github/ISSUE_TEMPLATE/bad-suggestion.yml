name: Bad suggestion from the agent
description: The agent added a needless clone, Box, Rc<RefCell>, 'static, or other workaround while using this skill.
labels: [rule-gap]
body:
  - type: input
    id: agent
    attributes:
      label: Agent and model
      placeholder: e.g. Claude Code with Sonnet, Codex CLI, Cursor
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt you gave the agent
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: Original code
      render: rust
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: What the agent produced
      render: rust
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
