<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Agent fixing E0382 with and without the skill</title>
  <desc id="desc">Without the skill the agent adds report.clone(). With rust-ownership-optimizer it changes the parameter to a borrow and cargo check passes with zero clones.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 17px; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .dim { fill: #8b949e; }
    .txt { fill: #e6edf3; }
    .red { fill: #ff7b72; }
    .grn { fill: #7ee787; }
    .org { fill: #ffa657; }
    .blu { fill: #79c0ff; }
    .pur { fill: #d2a8ff; }
  </style>
  <defs>
    <clipPath id="type1">
      <rect x="40" y="70" width="0" height="30">
        <animate attributeName="width" values="0;0;600;600;0" keyTimes="0;0.02;0.12;0.96;1" dur="14s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="type2">
      <rect x="40" y="352" width="0" height="30">
        <animate attributeName="width" values="0;0;820;820;0" keyTimes="0;0.6;0.66;0.96;1" dur="14s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- window -->
  <rect x="10" y="10" width="880" height="450" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="10" y="10" width="880" height="40" rx="14" fill="#161b22"/>
  <rect x="10" y="36" width="880" height="14" fill="#161b22"/>
  <circle cx="38" cy="30" r="7" fill="#ff5f56"/>
  <circle cx="60" cy="30" r="7" fill="#ffbd2e"/>
  <circle cx="82" cy="30" r="7" fill="#27c93f"/>
  <text x="450" y="35" text-anchor="middle" class="sans dim" font-size="14">report.rs</text>

  <!-- prompt (typed) -->
  <g clip-path="url(#type1)">
    <text x="40" y="90" class="mono"><tspan class="grn">❯</tspan><tspan class="txt"> fix </tspan><tspan class="red">error[E0382]</tspan><tspan class="txt">: borrow of moved value: `report`</tspan></text>
  </g>

  <!-- without skill -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.18;0.94;1" dur="14s" repeatCount="indefinite"/>
    <rect x="40" y="112" width="820" height="104" rx="8" fill="#ff7b72" fill-opacity="0.07" stroke="#ff7b72" stroke-opacity="0.35"/>
    <text x="56" y="136" class="sans red" font-size="13" >without the skill</text>
    <text x="56" y="166" class="mono"><tspan class="blu">print_report</tspan><tspan class="txt">(report</tspan><tspan class="red" font-weight="700">.clone()</tspan><tspan class="txt">);</tspan><tspan class="dim">   // copies 1 String + 1 Vec&lt;String&gt;</tspan></text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.28;0.94;1" dur="14s" repeatCount="indefinite"/>
      <text x="56" y="198" class="mono"><tspan class="dim">compiles, but copies the whole report on every call</tspan></text>
    </g>
  </g>

  <!-- with skill -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.39;0.94;1" dur="14s" repeatCount="indefinite"/>
    <rect x="40" y="232" width="820" height="104" rx="8" fill="#7ee787" fill-opacity="0.06" stroke="#7ee787" stroke-opacity="0.35"/>
    <text x="56" y="256" class="sans grn" font-size="13" >with rust-ownership-optimizer</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.45;0.94;1" dur="14s" repeatCount="indefinite"/>
      <text x="56" y="286" class="mono"><tspan class="pur">fn</tspan><tspan class="blu"> print_report</tspan><tspan class="txt">(report: </tspan><tspan class="grn" font-weight="700">&amp;</tspan><tspan class="org">Report</tspan><tspan class="txt">)</tspan><tspan class="dim">        // only reads: borrow it</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.53;0.94;1" dur="14s" repeatCount="indefinite"/>
      <text x="56" y="316" class="mono"><tspan class="blu">print_report</tspan><tspan class="txt">(</tspan><tspan class="grn" font-weight="700">&amp;</tspan><tspan class="txt">report);  </tspan><tspan class="blu">archive</tspan><tspan class="txt">(report);</tspan><tspan class="dim">  // last use moves</tspan></text>
    </g>
  </g>

  <!-- finding line (typed) -->
  <g clip-path="url(#type2)">
    <text x="40" y="372" class="mono"><tspan class="org">[clone]</tspan><tspan class="txt"> report.rs:17: clone for a read-only call -&gt; take &amp;Report</tspan></text>
  </g>

  <!-- result -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.75;0.94;1" dur="14s" repeatCount="indefinite"/>
    <text x="40" y="412" class="mono"><tspan class="dim">$ cargo check</tspan><tspan class="grn">  Finished</tspan><tspan class="dim"> `dev` profile [unoptimized + debuginfo]</tspan></text>
  </g>

  <!-- blinking cursor -->
  <rect x="40" y="428" width="10" height="20" fill="#f74c00">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
